<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041f17" />
      <stop offset="100%" stop-color="#020806" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="sproutGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Background Base with subtle border -->
  <rect width="32" height="32" rx="7" fill="url(#bgGrad)" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.2" />

  <!-- Seed Base (Organic, teardrop foundation) -->
  <path d="M16 26 C12 26 9.5 22.5 10 18.5 C10.5 14.5 14 11 16 8 C18 11 21.5 14.5 22 18.5 C22.5 22.5 20 26 16 26 Z" 
        fill="#064e3b" opacity="0.85" />

  <!-- Left Seed/Leaf Cotyledon -->
  <path d="M16 25 C12.5 25 10.5 21.8 11 18 C11.5 14.5 14.5 11.5 16 9.5 C16 14.5 14.5 20 16 25 Z" 
        fill="url(#leafGrad)" />

  <!-- Right Sprouting Growth Leaf -->
  <path d="M16 25 C17.5 20 18.5 14.5 16 9.5 C18.5 7 23 7.5 24 12 C24.8 15.5 21.5 21 16 25 Z" 
        fill="url(#sproutGrad)" />

  <!-- Quantum / Scientific Core Node -->
  <circle cx="16" cy="18" r="1.8" fill="#ecfdf5" />
  <circle cx="16" cy="18" r="2.8" stroke="#34d399" stroke-width="0.8" fill="none" opacity="0.75" />
</svg>
